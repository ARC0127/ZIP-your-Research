<svg xmlns="http://www.w3.org/2000/svg" width="720" height="690" viewBox="0 0 720 690" fill="none" role="img" aria-labelledby="title description">
  <title id="title">ZIP your Research — Make every claim earn its place.</title>
  <desc id="description">A mobile cover for ZYR. The illustrative workflow reads: question, evidence, next check. It does not display experiment results.</desc>
  <rect width="720" height="690" rx="20" fill="#131F24"/>
  <path d="M44 107H676M44 604H676" stroke="#3A4B4D"/>
  <path d="M47 46H78L47 77H78M62 35V45M62 78V88" stroke="#D9EFAC" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="100" y="70" fill="#F2F5EE" font-size="23" font-weight="700" letter-spacing="2">ZIP YOUR RESEARCH</text>
    <text x="676" y="69" fill="#B3C9BA" font-size="20" text-anchor="end">v1.7.0</text>
    <text x="44" y="164" fill="#A3B6AE" font-size="17" letter-spacing="2.7">A WORKFLOW FOR AGENTIC RESEARCH</text>
    <text x="40" y="250" fill="#F2F5EE" font-size="73" font-weight="700" letter-spacing="-3">Make every</text>
    <text x="40" y="332" fill="#F2F5EE" font-size="73" font-weight="700" letter-spacing="-3">claim earn</text>
    <text x="40" y="414" fill="#D9EFAC" font-size="73" font-weight="700" letter-spacing="-3">its place.</text>
    <text x="44" y="473" fill="#BBCDC1" font-size="24">Keep the evidence behind the answer.</text>
    <rect x="44" y="516" width="632" height="52" rx="8" fill="#23372F" stroke="#48634F"/>
    <text x="68" y="549" fill="#D9EFAC" font-size="18" letter-spacing="1">QUESTION</text>
    <path d="M201 541H226M221 536L227 541L221 546" stroke="#8EB890" stroke-width="2"/>
    <text x="246" y="549" fill="#D9EFAC" font-size="18" letter-spacing="1">EVIDENCE</text>
    <path d="M379 541H404M399 536L405 541L399 546" stroke="#8EB890" stroke-width="2"/>
    <text x="424" y="549" fill="#D9EFAC" font-size="18" letter-spacing="1">NEXT CHECK</text>
    <text x="676" y="589" fill="#8DA79A" font-size="12" letter-spacing="1.4" text-anchor="end">ILLUSTRATIVE WORKFLOW</text>
    <text x="44" y="650" fill="#B5C6BD" font-size="17" letter-spacing="1">PROOF / WRITING / FIGURES / CODE</text>
  </g>
</svg>
