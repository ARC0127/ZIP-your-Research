third_party:
  manifest: manifests/THIRD_PARTY_ASSETS.yaml
  capabilities_manifest: manifests/RELEASE_CAPABILITIES.yaml
  allowed_asset_ids:
    - rpws
  require_license_status: VERIFIED_LOCAL
  require_redistribution_status: ALLOWED
  block_unknown_or_unlisted: true

secrets:
  max_text_scan_bytes: 2097152
  patterns:
    - id: openai_key
      regex: '(?<![A-Za-z0-9])sk-(?:proj-)?[A-Za-z0-9_-]{20,}'
    - id: github_pat
      regex: 'gh[pousr]_[A-Za-z0-9]{30,}'
    - id: aws_access_key
      regex: 'AKIA[0-9A-Z]{16}'
    - id: private_key
      regex: '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
    - id: assigned_secret
      regex: '(?i)(?:api[_-]?key|access[_-]?token|client[_-]?secret|password)\s*[:=]\s*["'']?[A-Za-z0-9_./+=-]{16,}'

zip:
  max_entries: 4096
  max_archive_bytes: 268435456
  max_entry_uncompressed_bytes: 33554432
  max_total_uncompressed_bytes: 268435456
  max_compression_ratio: 200
  timestamp_utc:
    - 1980
    - 1
    - 1
    - 0
    - 0
    - 0
  compression: deflate
  compresslevel: 9
  file_mode: "0644"
  generated_manifest_path: RELEASE_MANIFEST_v1_7.json
