schema_version: 1
policy_version: v1.7
archive_root: ZIP-your-Research
source_mode: git_tracked_only
default_version_file: VERSION

allow:
  exact:
    - .gitattributes
    - .gitignore
    - AGENTS.md
    - AUTOBOOT_v1.3.md
    - CHANGELOG.md
    - CONTRIBUTING.md
    - INDEX.md
    - LICENSE
    - README.md
    - VERSION
    - artifacts/evidence_ledger.csv
    - artifacts/negative_result_ledger.md
    - artifacts/proof_casebook.md
    - artifacts/run_state.json
    - requirements.txt
    - skills_manifest.yaml
    - v
  prefixes:
    - .claude/skills/
    - .github/skills/
    - boot/
    - docs/
    - interfaces/
    - manifests/
    - research/
    - router/
    - skills/
    - templates/
    - tests/
    - tools/
    - ext/src/rpws/

deny:
  prefixes:
    - .git/
    - .github/workflows/
    - dist/
    - local/
    - memory/
    - transcripts/
    - ext/src/S340_v4.2_theory_global_skill_bundle/
    - ext/src/awesome/
    - ext/src/figures/
  path_parts:
    # Runtime/user data roots are denied by prefix above. Keep nested public
    # paths such as docs/memory/ and templates/memory/ eligible for release.
    - __pycache__
    - .mypy_cache
    - .pytest_cache
    - .ruff_cache
    - .tox
    - .venv
    - node_modules
  basenames:
    - .env
    - .env.local
    - .env.production
    - .env.test
    - credentials.json
    - secrets.json
  name_globs:
    - "*.7z"
    - "*.bin"
    - "*.bz2"
    - "*.gz"
    - "*.key"
    - "*.p12"
    - "*.pem"
    - "*.pfx"
    - "*.tar"
    - "*.xz"
    - "*.zip"
    - "id_rsa*"
    - "memory*.json"
    - "memory*.jsonl"
    - "transcript*.json"
    - "transcript*.jsonl"

