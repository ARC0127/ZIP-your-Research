name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: zyr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate authoritative manifest and generated artifacts
        run: |
          python -B tools/zyr.py manifest
          python -B tools/zyr.py build --check
          python -B tools/validate_v7_1.py
          python -B tools/zyr.py check --ci

      - name: Run routing, evolution, security, and release regressions
        run: |
          python -B tools/zyr.py route-test
          python -B -m unittest \
            tests.evolution.test_public_mutations_v1 \
            tests.integrity.test_manifest_closure \
            tests.integrity.test_release_capabilities \
            tests.security.test_openalex_redaction \
            tests.release.test_make_release_v1_7 \
            tests.skill_memory.test_skill_memory_v1

      - name: Build, audit, and self-check the default-safe release
        run: |
          release_zip="${RUNNER_TEMP}/ZIP-your-Research_release.zip"
          python -B tools/make_release_v1_7.py --out "${release_zip}"
          python -B tools/zyr.py release-audit "${release_zip}"

          extracted_root="$(mktemp -d "${RUNNER_TEMP}/zyr-release-extracted.XXXXXX")"
          python -B -m zipfile -e "${release_zip}" "${extracted_root}"
          package_root="${extracted_root}/ZIP-your-Research"
          test -f "${package_root}/tools/zyr.py"

          python -B "${package_root}/tools/zyr.py" check --ci
          printf '%s\n' "STRUCTURAL_PASS"
          python -B "${package_root}/tools/zyr.py" route-test
          printf '%s\n' "ROUTER_CASES_PASS"
          printf '%s\n' "S660_BEHAVIORAL_NOT_RUN"
          printf '%s\n' "SCIENTIFIC_NOT_RUN"

      - name: Assert that CI made no repository changes
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short --untracked-files=all
            exit 1
          fi
